<router-outlet></router-outlet>
<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
>
  <div class="text-align">
    <img
      src="../assets/img/loading.gif"
      width="120"
      height="120"
      style="border-radius: 50%"
    />
  </div>
</ngx-spinner>
<div
  class="mess"
  *ngIf="errorMessage"
  [class.error]="errorMessage.type === 'error'"
  [class.success]="errorMessage.type === 'success'"
  [class.normal]="
    errorMessage.type !== 'success' && errorMessage.type !== 'error'
  "
>
  <i class="bx bx-error" *ngIf="errorMessage.type === 'error'"></i>
  <i class="bx bx-check-square" *ngIf="errorMessage.type === 'success'"></i>
  <i
    class="bx bx-message-dots"
    *ngIf="errorMessage.type !== 'success' && errorMessage.type !== 'error'"
  ></i>
  {{ errorMessage.message }}
</div>
