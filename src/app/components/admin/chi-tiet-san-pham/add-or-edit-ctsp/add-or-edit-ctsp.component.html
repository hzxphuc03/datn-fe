<div class="add-or-edit-page">
  <div class="header">Chi tiết sản phẩm</div>
  <div class="san-pham" style="margin-top: 20px">
    <div class="avatar">
      <label for="avatar" class="chosse-img">
        <div class="show-img">
          <img
            src="https://tamanh.net/wp-content/uploads/2021/08/goc-chup-anh-giay-dep.jpg"
            alt=""
          />
        </div>
        <div class="text">Choose avatar</div>
      </label>
      <input style="display: none" id="avatar" type="file" accept="image/*" />
    </div>
    <div
      class="input-san-pham"
      style="
        display: flex;
        flex-direction: column;
        gap: 20px;
        justify-content: space-around;
      "
    >
      <div style="display: flex; gap: 20px; width: 100%">
        <div class="float-input name">
          <input
            class="text-input"
            placeholder=""
            [(ngModel)]="data.sanPham.ma"
          />
          <label for="email" class="input-label">Mã</label>
        </div>
        <div class="float-input name">
          <input
            class="text-input"
            placeholder=""
            [(ngModel)]="data.sanPham.ten"
          />
          <label for="email" class="input-label">Tên</label>
        </div>
      </div>
      <div style="width: 100%">
        <textarea
          name=""
          id=""
          rows="10"
          style="width: 100%; border-radius: 12px; padding: 10px"
          placeholder="Mô tả"
          [(ngModel)]="data.sanPham.moTa"
        ></textarea>
      </div>
      <div style="display: flex; gap: 20px; width: 100%">
        <div class="float-input name">
          <input
            class="text-input"
            placeholder=""
            [(ngModel)]="data?.sanPham.ngayTao"
          />
          <label for="email" class="input-label">Người tạo</label>
        </div>
        <div class="float-input name">
          <input
            class="text-input"
            placeholder=""
            [(ngModel)]="data.sanPham.ngayTao"
          />
          <label for="email" class="input-label">Ngày tạo</label>
        </div>
        <div class="float-input name">
          <input
            class="text-input"
            placeholder=""
            [(ngModel)]="data.sanPham.ngaySua"
          />
          <label for="email" class="input-label">Ngày sửa</label>
        </div>
      </div>
    </div>
  </div>
</div>
