<div class="all-contents">
  <div class="header">Chi tiết sản phẩm</div>
  <div class="action-header">
    <button class="btn" *ngIf="isAdd" (click)="addOrEdit()">
      Thêm mới nhân viên
    </button>
    <button class="btn" *ngIf="!isAdd" (click)="addOrEdit()">
      Cập nhật nhân viên
    </button>
  </div>
  <div class="content" *ngIf="data">
    <div class="left item-sanpham">
      <label class="uploadimg" for="upload-file">
        <img
          [src]="data?.hinhAnh"
          alt=""
          *ngIf="data?.hinhAnh"
        />
        <span>UploadFile</span>
      </label>
      <input
        type="file"
        id="upload-file"
        accept="image/*"
        style="display: none"
        (change)="onFileSelected($event)"
      />
    </div>
    <div class="d-flex info">
      <span class="p-float-label">
        <input id="float-input" type="text" pInputText [(ngModel)]="data.ma" />
        <label for="float-input">Mã nhân viên</label>
      </span>
      <span class="p-float-label">
        <input
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data.hoTen"
        />
        <label for="float-input">Họ và Tên</label>
      </span>
      <span class="p-float-label">
        <p-calendar [(ngModel)]="data.ngaySinh"  id="float-input"  [touchUI]="true" 
        [readonlyInput]="true"></p-calendar>
        <label for="float-input">Ngày sinh</label>
      </span>
      <span class="p-float-label">
        <input
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data.soDienThoai"
        />
        <label for="float-input">Số điện thoại</label>
      </span>
      <span
        class="p-float-label"
        style="height: 50px; justify-content: center; align-items: center"
      >
        <div style="width: 30%">Giới tính:</div>
        <div class="flex align-items-center" style="width: 40%">
          <p-radioButton
            name="gender"
            value="1"
            [(ngModel)]="data.gioiTinh"
            inputId="ingredient2"
          ></p-radioButton>
          <label for="ingredient2" class="ml-2" style="margin-left: 10px">
            Nam
          </label>
        </div>
        <div class="flex align-items-center" style="width: 40%">
          <p-radioButton
            name="gender"
            value="0"
            [(ngModel)]="data.gioiTinh"
            inputId="ingredient1"
          ></p-radioButton>
          <label for="ingredient1" class="ml-2" style="margin-left: 10px">
            Nữ
          </label>
        </div>
      </span>
      <span class="p-float-label">
        <input
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data.diaChi"
        />
        <label for="float-input">Địa chỉ</label>
      </span>
      <span class="p-float-label">
        <input
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data.email"
        />
        <label for="float-input">Email</label>
      </span>
      <span class="p-float-label">
        <input
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data.taiKhoan"
        />
        <label for="float-input">Tài khoản</label>
      </span>
      <span class="p-float-label">
        <input
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data.matKhau"
        />
        <label for="float-input">Mật khẩu</label>
      </span>
      <span class="p-float-label drop-down" style="width: 33%">
        <input
          (click)="
           data?.chucVu.isOpen
              ? (data?.chucVu.isOpen = false)
              : (data?.chucVu.isOpen = true)
          "
          id="float-input"
          type="text"
          pInputText
          [(ngModel)]="data?.chucVu.ten"
          readonly
        />
        <label for="float-input">Chức vụ</label>
        <div
          class="option-drop-down chuc-vu-dropdown"
          *ngIf="data?.chucVu.isOpen"
          (scroll)="onScrollChucVu()"
        >
          <div
            class="option"
            *ngFor="let item of chucVu"
            [class.active-drop]="item.id === data?.chucVu?.id"
          >
            <div
              (click)="
                data.chucVu = item;
                data?.chucVu.isOpen = false
              "
            >
              {{ item.ten }}
            </div>
          </div>
        </div>
      </span>
    </div>
  </div>
</div>
