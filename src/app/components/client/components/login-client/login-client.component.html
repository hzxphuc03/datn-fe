<body
  class="img js-fullheight"
  style="
    background-image: url('https://www.elleman.vn/wp-content/uploads/2018/08/13/gi%C3%A0y-sneakers-2-elle-man-8.jpg');
  "
>
  <div class="overlay"></div>
  <section
    class="ftco-section"
    style="height: 100vh; position: relative; z-index: 9999"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 text-center mb-5">
          <h2 class="heading-section">Đăng nhập</h2>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="login-wrap p-0">
            <h3 class="mb-4 text-center">Bạn đã có tài khoản?</h3>
            <div action="#" class="signin-form">
              <div class="form-group">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Username"
                  required
                  [(ngModel)]="username"
                />
              </div>
              <div class="form-group">
                <input
                  id="password-field"
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  required
                  [(ngModel)]="password"
                />
                <span
                  toggle="#password-field"
                  class="fa fa-fw fa-eye field-icon toggle-password"
                ></span>
              </div>
              <div class="form-group">
                <button
                  type="submit"
                  class="form-control btn btn-primary submit px-3"
                  (click)="onSubmit()"
                >
                  Sign In
                </button>
              </div>
              <div class="form-group d-md-flex">
                <div class="w-50">
                  <label class="checkbox-wrap checkbox-primary"
                    >Remember Me
                    <input type="checkbox" checked />
                    <span class="checkmark"></span>
                  </label>
                </div>
                <div class="w-50 text-md-right">
                  <a href="#" style="color: #fff">Forgot Password</a>
                </div>
              </div>
            </div>
            <p class="w-100 text-center">&mdash; Or Sign In With &mdash;</p>
            <div class="social d-flex text-center">
              <a href="#" class="px-2 py-2 mr-md-1 rounded"
                ><span class="ion-logo-facebook mr-2"></span> Facebook</a
              >
              <a href="#" class="px-2 py-2 ml-md-1 rounded"
                ><span class="ion-logo-twitter mr-2"></span> Twitter</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
