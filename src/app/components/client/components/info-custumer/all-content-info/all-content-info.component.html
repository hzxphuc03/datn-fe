<div
  class="title"
  style="font-weight: bold; padding-left: 20px; font-size: 20px"
>
  Thông tin khách hàng
</div>
<div class="all-content">
  <!-- option-list.component.html -->
  <div class="left">
    <div class="show-info-check">
      <div class="all-option" [ngClass]="{ open: true }">
        <div class="items" *ngFor="let item of options; let i = index">
          <div
            class="option"
            [class.checkedS]="selectedIndex === i"
            (click)="selectOption(i)"
          >
            <span>{{ item }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="right">
    <app-info-user *ngIf="selectedIndex === 0"></app-info-user>
    <app-voucher-khach-hang
      *ngIf="selectedIndex === 2"
    ></app-voucher-khach-hang>
    <app-dia-chi-khach-hang
      *ngIf="selectedIndex === 3"
    ></app-dia-chi-khach-hang>
    <app-trung0tam-ho-tro *ngIf="selectedIndex === 5"></app-trung0tam-ho-tro>
  </div>
</div>
