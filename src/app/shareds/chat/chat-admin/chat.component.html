<div class="chat">
  <div class="content">
    <div class="left">
      <div class="all-content">
        <div class="header">
          <div class="title">Đoạn chat</div>
        </div>
        <div class="search">
          <i class="bx bx-search"></i>
          <input type="text" placeholder="Tìm kiếm trên chat" />
        </div>
        <div class="list-user-chat">
          <div class="user">
            <img
              src="https://ttol.vietnamnetjsc.vn/images/2018/12/22/18/49/gai-Nga-xinh-dep-10.jpg"
              alt=""
            />
            <div class="right">
              <div class="name">Nguyễn Khánh Duy</div>
              <div class="text">Hello bạn khỏe không ?</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="all-content">
        <div class="header">
          <div class="left">
            <img src="https://ttol.vietnamnetjsc.vn/images/2018/12/22/18/49/gai-Nga-xinh-dep-10.jpg" alt="">
            <div class="name">Nguyễn Khánh Duy</div>
          </div>
          <div class="right" style="align-items: center;"></div>
        </div>
        <div class="list-messages">
          <div class="from messages"><div class="text">Hello bebe</div></div>
          <div class="to messages"><img class="avata" src="https://ttol.vietnamnetjsc.vn/images/2018/12/22/18/49/gai-Nga-xinh-dep-10.jpg" alt="">
          <div class="text">Nhu nao ???</div></div>
        </div>
        <div class="chatText">
          <div class="input-mess"><input type="text"></div>
          <div class="icon-send"><i class='bx bx-send'(click)="sendMessage()" ></i></div>
        </div>
      </div>
    </div>
  </div>
</div>
