<div class="sidebar" [class.open]="isOpen">
  <div class="logo-details">
    <img
      class="icon"
      src="../assets/img/logo.png"
      style="width: 50px"
      alt=""
      style="border-radius: 50%; width: 50px; margin-right: 20px"
    />
    <div class="logo_name">Manager</div>
    <i
      style="cursor: pointer"
      class="bx bx-menu"
      id="btn"
      (click)="openSlide()"
    ></i>
  </div>
  <ul class="nav-list">
    <li *ngFor="let item of actionNavItems">
      <a [routerLink]="item.url" *ngIf="item.type !== 'drop'">
        <i class="{{ item.icon }}"></i>
        <span class="links_name">{{ item.name }}</span>
      </a>
      <a
        *ngIf="item.type === 'drop'"
        style="cursor: pointer; display: flex; justify-content: space-between"
        (click)="item.open = !item.open"
      >
        <div>
          <i class="{{ item.icon }}"></i>
          <span class="links_name">{{ item.name }}</span>
        </div>
        <i class="bx bxs-chevron-down" *ngIf="!item.open"></i>
        <i class="bx bxs-chevron-up" *ngIf="item.open"></i>
      </a>
      <div
        class="option-item-drop"
        *ngIf="item.type === 'drop' && item.open && isOpen"
      >
        <li *ngFor="let dropItem of item.item">
          <a [routerLink]="dropItem.url">
            <i class="bx bx-subdirectory-right"></i>
            <i class="{{ dropItem.icon }}"></i>
            <span class="links_name">{{ dropItem.name }}</span>
          </a>
        </li>
      </div>
      <div
        class="option-item-drop is-close-nav"
        *ngIf="item.type === 'drop' && item.open && !isOpen"
        (click)="item.open = !item.open"
      >
        <li *ngFor="let dropItem of item.item">
          <a [routerLink]="dropItem.url">
            <i class="bx bx-subdirectory-right"></i>
            <i class="{{ dropItem.icon }}"></i>
            <span class="links_name">{{ dropItem.name }}</span>
          </a>
        </li>
      </div>
      <span class="tooltip" *ngIf="item.type !== 'drop'">{{ item.name }}</span>
    </li>
    <li>
      <a [routerLink]="'/auth/admin/chat'">
        <i class="bx bx-cog"></i>
        <span class="links_name">{{ "Chat" }}</span>
      </a>
      <span class="tooltip">{{ "Chat" }}</span>
    </li>
    <li>
      <a>
        <i class="bx bx-cog"></i>
        <span class="links_name">{{ "Setting" }}</span>
      </a>
      <span class="tooltip">{{ "Setting" }}</span>
    </li>
    <li class="profile" (click)="logOut()">
      <div class="profile-details">
        <i class="bx bx-export"></i>
        <div class="name_job">
          <div class="name">Logout</div>
        </div>
      </div>
      <i class="bx bx-log-out" id="log_out"></i>
    </li>
  </ul>
</div>
<section class="home-section">
  <router-outlet></router-outlet>
</section>
